---
name: "Setup Bun + Node + deps"
description: |
  Checkout-independent setup: installs Bun, Node, and project dependencies

inputs:
  node-version:
    description: "Node.js version (LTS recommended for CI stability)"
    required: false
    default: "24"

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      # Pinned action SHA for supply-chain safety.
      # Tag v2.2.0 -> commit 0c5077e51419868618aeaa5fe8019c62421857d6
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.9

    - name: Setup Node.js
      # Pinned action SHA for supply-chain safety.
      # Tag v6.2.0 -> commit 6044e13b5dc448c55e2357c09f80417699197238
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache dependencies
      # Pinned action SHA for supply-chain safety.
      # Tag v5.0.5 -> commit 27d5ce7f107fe9357f9df03efb73ab90386fccae
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          node_modules
          ~/.bun/install/cache
        key: >-
          bun-${{ runner.os }}-${{ inputs.node-version }}-
          ${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ inputs.node-version }}-
          bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
