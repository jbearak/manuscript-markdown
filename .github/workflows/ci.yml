---
name: CI

"on":
  pull_request:
  workflow_dispatch:

# Avoid wasting CI minutes by canceling older runs of the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
      binaries: ${{ steps.filter.outputs.binaries }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            source:
              - 'package.json'
              - 'bun.lock'
              - 'esbuild.mjs'
              - 'eslint.config.mjs'
              - 'tsconfig*.json'
              - 'src/**'
              - 'scripts/**'
              - 'test/**'
              - '.vscodeignore'
              - 'language-configuration.json'
              - 'snippets.json'
              - 'syntaxes/**'
              - 'media/**'
              - '.github/actions/setup/**'
              - '.github/workflows/ci.yml'

            binaries:
              - 'src/**'
              - 'package.json'
              - 'bun.lock'
              - 'esbuild.mjs'
              - 'scripts/build-binary.ts'
              - '.github/actions/setup/**'
              - '.github/workflows/ci.yml'

  verify:
    name: Verify (lint + typecheck + tests)
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun test

  vscode-extension:
    name: VS Code extension
    needs: [changes, verify]
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build extension
        run: bun run package
      - name: Validate VSIX contents
        run: |
          shopt -s nullglob
          vsix_files=( *.vsix )
          if [ "${#vsix_files[@]}" -eq 0 ]; then
            echo "ERROR: No .vsix package produced"
            exit 1
          fi
          vsix="${vsix_files[0]}"
          ls -la "$vsix"

          # Verify required bundled files are present and non-trivial
          for f in \
            extension/out/extension.js \
            extension/out/server.js \
            extension/out/csl-styles/bmj.csl \
            extension/out/csl-styles/chicago-author-date.csl \
            extension/out/csl-styles/chicago-notes-bibliography.csl \
            extension/out/csl-styles/chicago-shortened-notes-bibliography.csl \
            extension/out/csl-styles/nature.csl \
            extension/out/csl-styles/nlm-citation-sequence.csl \
            extension/out/csl-styles/nlm-citation-sequence-brackets.csl \
            extension/out/csl-styles/vancouver.csl \
            extension/out/csl-locales/locales-en-US.xml; do
            size=$(unzip -l "$vsix" "$f" 2>/dev/null | awk -v target="$f" '$NF == target { print $1; exit }')
            if [ -z "$size" ] || [ "$size" -lt 1000 ]; then
              echo "ERROR: $f missing or too small (${size:-0} bytes)"
              exit 1
            fi
            echo "OK: $f ($size bytes)"
          done

          # Legacy Chicago identifiers are runtime aliases, not packaged assets.
          for f in \
            extension/out/csl-styles/chicago-fullnote-bibliography.csl \
            extension/out/csl-styles/chicago-note-bibliography.csl; do
            if unzip -l "$vsix" "$f" 2>/dev/null | grep -q "$f"; then
              echo "ERROR: obsolete CSL asset present: $f"
              exit 1
            fi
          done

          # Verify node_modules did NOT leak into the VSIX
          if unzip -l "$vsix" | grep -q 'extension/node_modules/'; then
            echo "ERROR: node_modules leaked into VSIX"
            unzip -l "$vsix" | grep 'extension/node_modules/' | head -5
            exit 1
          fi
          echo "OK: no node_modules in VSIX"

          # Verify manifest
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!pkg.engines?.vscode) throw new Error('Missing VS Code engine');
            if (pkg.bundledDependencies) throw new Error('bundledDependencies should not exist (deps are esbuild-inlined)');
            console.log('Extension:', pkg.displayName);
            console.log('Version:', pkg.version);
            console.log('Publisher:', pkg.publisher);
          "

  binaries:
    name: Binary artifacts
    needs: [changes, verify]
    if: needs.changes.outputs.binaries == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build current platform binary
        run: bun run build:current
      - name: Test binary execution
        shell: bash
        run: |
          ARCH="$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')"
          if [ -z "${ARCH}" ]; then
            echo "ERROR: RUNNER_ARCH is not set"
            exit 1
          fi
          case "${ARCH}" in
            x64|arm64) ;;
            *)
              echo "ERROR: Unsupported RUNNER_ARCH value: ${RUNNER_ARCH}"
              exit 1
              ;;
          esac
          case "${{ runner.os }}" in
            Windows) PLATFORM="windows"; EXT=".exe";;
            macOS)   PLATFORM="darwin"; EXT="";;
            Linux)   PLATFORM="linux"; EXT="";;
            *)
              echo "ERROR: Unsupported runner OS: ${{ runner.os }}"
              exit 1
              ;;
          esac
          BINARY="bin/manuscript-markdown-${PLATFORM}-${ARCH}${EXT}"
          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Expected binary not found: $BINARY"
            ls -la bin || true
            exit 1
          fi

          chmod +x "$BINARY" 2>/dev/null || true
          "$BINARY" --version
          "$BINARY" --help

          # Prove bundled CSL assets are embedded in the standalone executable.
          WORK_DIR="${RUNNER_TEMP}/manuscript-markdown-offline"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          ISOLATED_BINARY="$WORK_DIR/manuscript-markdown${EXT}"
          cp "$BINARY" "$ISOLATED_BINARY"
          chmod +x "$ISOLATED_BINARY" 2>/dev/null || true
          cat > "$WORK_DIR/paper.md" <<'EOF'
          ---
          csl: nlm-brackets
          ---

          Offline citation [@cited2024].
          EOF
          cat > "$WORK_DIR/paper.bib" <<'EOF'
          @article{cited2024,
            author = {Cited, Alice},
            title = {Embedded NLM Style Test},
            journal = {Journal of Tests},
            year = {2024}
          }
          @article{uncited2023,
            author = {Uncited, Bob},
            title = {This Entry Must Not Appear},
            journal = {Journal of Tests},
            year = {2023}
          }
          EOF
          "$ISOLATED_BINARY" "$WORK_DIR/paper.md" --force
          DOCX_PATH="$WORK_DIR/paper.docx" bun -e '
            import JSZip from "jszip";
            const bytes = await Bun.file(process.env.DOCX_PATH).arrayBuffer();
            const zip = await JSZip.loadAsync(bytes);
            const documentXml = await zip.file("word/document.xml").async("string");
            const customXml = await zip.file("docProps/custom.xml").async("string");
            if (!documentXml.includes("[1]")) throw new Error("NLM citation is not bracketed");
            if (!documentXml.includes("ZOTERO_BIBL")) throw new Error("Bibliography field missing");
            if (!documentXml.includes("Embedded NLM Style Test")) throw new Error("Cited entry missing");
            if (documentXml.includes("This Entry Must Not Appear")) throw new Error("Uncited entry included");
            if (!customXml.includes("nlm-citation-sequence-brackets")) throw new Error("Canonical NLM style ID missing");
          '

          # Prove hidden legacy identifiers resolve to embedded Chicago 18 assets.
          verify_chicago_alias() {
            local stem="$1"
            local alias="$2"
            local canonical="$3"
            cat > "$WORK_DIR/$stem.md" <<EOF
          ---
          csl: $alias
          ---

          Offline Chicago citation [@cited2024].
          EOF
            cp "$WORK_DIR/paper.bib" "$WORK_DIR/$stem.bib"
            "$ISOLATED_BINARY" "$WORK_DIR/$stem.md" --force
            DOCX_PATH="$WORK_DIR/$stem.docx" LEGACY_STYLE="$alias" CANONICAL_STYLE="$canonical" bun -e '
              import JSZip from "jszip";
              const bytes = await Bun.file(process.env.DOCX_PATH).arrayBuffer();
              const zip = await JSZip.loadAsync(bytes);
              const documentXml = await zip.file("word/document.xml").async("string");
              const customXml = await zip.file("docProps/custom.xml").async("string");
              if (!documentXml.includes("ZOTERO_BIBL")) throw new Error("Chicago bibliography field missing");
              if (!documentXml.includes("Embedded NLM Style Test")) throw new Error("Chicago cited entry missing");
              if (!customXml.includes(process.env.CANONICAL_STYLE)) throw new Error("Canonical Chicago style ID missing");
              if (customXml.includes(process.env.LEGACY_STYLE)) throw new Error("Legacy Chicago style ID persisted");
            '
          }

          verify_chicago_alias chicago chicago-fullnote-bibliography chicago-notes-bibliography
          verify_chicago_alias chicago-shortened chicago-note-bibliography chicago-shortened-notes-bibliography
